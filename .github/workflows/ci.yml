name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv no publica tags mayores ("v10")
        with:
          enable-cache: true
      - name: Instalar dependencias
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check .
      - name: Tipos
        run: uv run mypy
      - name: Tests (sin API real)
        run: uv run pytest
