[project]
name = "jarvis-os"
version = "0.0.1"
description = "JARVIS: asistente IA integrado a JARVIS-OS (Debian 13 + XFCE)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Roman" }]
dependencies = [
    "claude-agent-sdk",
    "dbus-fast",
    "psutil",
    "pydantic>=2",
    "platformdirs",
    "typer",
    "aiosqlite",
]

[project.optional-dependencies]
# Fase 1c. Se instalan con: uv sync --extra voice
voice = [
    "sounddevice",
    "openwakeword",
    "faster-whisper",
    "piper-tts",
]

[project.scripts]
jarvis = "jarvis.cli:app"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "types-psutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", "design"]  # los bloques de código de los docs son bocetos

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle + pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "ASYNC",        # errores comunes de asyncio
    "S",            # bandit: seguridad (shell=True, etc.)
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert está bien en tests

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -m 'not live'"
markers = [
    "live: llama a la API real de Claude o a servicios del sistema (no corre en CI)",
]
