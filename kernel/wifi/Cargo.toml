[package]
name = "jarvis-wifi"
description = "Wi-Fi de JARVIS-OS (K14): tramas 802.11, RSN y WPA2-PSK (PMK, PTK, el saludo de 4 vías, CCMP). no_std y testeable en el host."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Primitivas de RustCrypto (las mismas familias que usa jarvis-tls).
aes = { version = "0.8", default-features = false }
ccm = { version = "0.5", default-features = false }
hmac = { version = "0.12", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = { version = "0.10", default-features = false }

# En el kernel (sin SSE), SHA-1 por software, como SHA-2 en jarvis-tls.
[target.'cfg(target_os = "none")'.dependencies]
sha1 = { version = "0.10", default-features = false, features = ["force-soft"] }

[lints]
workspace = true
