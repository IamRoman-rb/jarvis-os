[workspace]
resolver = "3"
members = ["audio", "desktop", "drivers", "fs", "gfx", "image", "kernel", "linux", "mem", "net", "relay", "sync", "task", "tls", "wifi", "xtask"]
# El kernel solo compila para x86_64-unknown-none (lo hace `cargo xtask`). Sin esto,
# `cargo test` o `cargo build` a secas intentarían compilarlo para Windows/Linux y fallarían.
default-members = ["audio", "desktop", "drivers", "fs", "gfx", "image", "linux", "mem", "net", "relay", "sync", "task", "tls", "wifi", "xtask"]
# Los programas de Linux (K11) son otro workspace: se compilan para musl (cargo xtask usuario).
exclude = ["usuario"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = 1

# acpi 6.1.1 deja IndexField y BankField como `todo!()`, y el AML de VirtualBox los usa
# (pánico al arrancar). Copia con eso implementado en vendor/acpi/src/aml/mod.rs.
[patch.crates-io]
acpi = { path = "vendor/acpi" }
