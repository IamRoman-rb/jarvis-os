[package]
name = "jarvis-desktop"
description = "Escritorio de JARVIS-OS: eventos, modos y la app Archivos. no_std, testeable en el host."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jarvis-fs = { path = "../fs" }
jarvis-linux = { path = "../linux" }
jarvis-gfx = { path = "../gfx" }
jarvis-image = { path = "../image" }
# Mosaicos de Brave comprimidos (ADR 0007). Sin std: el kernel los descomprime.
lz4_flex = { version = "0.11", default-features = false }
jarvis-sync = { path = "../sync" }

[dev-dependencies]
fatfs = "0.3.6"
# Solo para la vista previa (tests/vista_previa.rs): convierte las imágenes como el puente.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
resvg = { version = "0.45", default-features = false }

[lints]
workspace = true
