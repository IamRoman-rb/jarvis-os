[package]
name = "jarvis-desktop"
description = "Escritorio de JARVIS-OS: eventos, modos y la app Archivos. no_std, testeable en el host."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jarvis-fs = { path = "../fs" }
jarvis-linux = { path = "../linux" }
jarvis-audio = { path = "../audio" }
jarvis-gfx = { path = "../gfx" }
jarvis-image = { path = "../image" }
# Mosaicos de Brave comprimidos (ADR 0007). Sin std: el kernel los descomprime.
lz4_flex = { version = "0.11", default-features = false }
jarvis-sync = { path = "../sync" }
# La clave de WPA2 (PMK) sale de la contraseña acá, al escribirla (K14).
jarvis-wifi = { path = "../wifi" }
# Los paquetes de Debian (`apt`): XZ sin `std` (term/debian.rs).
xz4rust = { version = "0.2", default-features = false, features = ["alloc", "crc64"] }
# El PIN de desbloqueo se guarda hasheado (pin.rs): las mismas versiones que wifi y tls.
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = { version = "0.10", default-features = false }

# En el kernel (sin SSE), SHA-2 por software, como en jarvis-tls.
[target.'cfg(target_os = "none")'.dependencies]
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }

[dev-dependencies]
fatfs = "0.3.6"
# Solo para la vista previa (tests/vista_previa.rs): convierte las imágenes como el puente.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
resvg = { version = "0.45", default-features = false }

[lints]
workspace = true
