[package]
name = "xtask"
description = "Tareas de build de JARVIS-OS: imagen booteable, QEMU, tests y capturas."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bootloader = { version = "0.11.17", default-features = false, features = ["uefi"] }
fatfs = "0.3.6"
jarvis-relay = { path = "../relay" }
png = "0.18"
# Puente HTTPS del anfitrión: el kernel todavía no tiene TLS (ver xtask/src/puente.rs).
ureq = "3"
# El puente convierte las imágenes de la web a BMP (el kernel solo lee BMP; ver ADR 0005).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
# Y dibuja los SVG (logos e íconos de las páginas).
resvg = { version = "0.45", default-features = false }
# Puente de Brave (ADR 0007): habla con Brave por DevTools (WebSocket + JSON) y usa el mismo
# protocolo que el kernel (jarvis-desktop::remote).
jarvis-desktop = { path = "../desktop" }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
serde_json = "1"
base64 = "0.22"

[lints]
workspace = true
