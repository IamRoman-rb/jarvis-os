# Como kernel/usuario/: estático (musl), enlazado con rust-lld y los objetos de musl que trae Rust.
# Sin `build.target`, para que `cargo test` corra en el anfitrión; xtask pasa
# `--target x86_64-unknown-linux-musl`.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes"]
