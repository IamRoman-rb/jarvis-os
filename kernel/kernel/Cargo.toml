[package]
name = "jarvis-kernel"
description = "Kernel de JARVIS-OS."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "jarvis-kernel"
test = false
bench = false

[dependencies]
bootloader_api = "0.11.17"
jarvis-gfx = { path = "../gfx" }
linked_list_allocator = "0.10.6"
pc-keyboard = "0.9.0"
pic8259 = "0.11.0"
spin = "0.12.3"
x86_64 = { version = "0.15.5", default-features = false, features = ["instructions", "abi_x86_interrupt"] }

[lints]
workspace = true
