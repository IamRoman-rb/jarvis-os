# Nightly fijado a una fecha: el crate `bootloader` lo necesita para compilar su etapa UEFI.
# Fijarlo hace que el build sea reproducible (en tu PC y en la CI). Para actualizarlo, cambiá la
# fecha y corré `cargo xtask test`.
[toolchain]
channel = "nightly-2026-09-20"
components = ["rust-src", "llvm-tools-preview", "rustfmt", "clippy"]
targets = ["x86_64-unknown-none", "x86_64-unknown-linux-musl"]
profile = "minimal"
